name: Build SDRangel Android APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libssl-dev pkg-config openjdk-17-jdk wget unzip
      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
      - name: Build APK
        run: |
          export ANDROID_NDK=$PWD/android-ndk-r25c
          chmod +x android/build-android.sh
          cd android
          ./build-android.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sdrangel-navtex-apk
          path: android/build/**/*.apk
